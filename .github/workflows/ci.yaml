name: CI Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install User Service dependencies
        run: |
          cd user-services
          npm install

      - name: Install Task Service dependencies
        run: |
          cd tasks-service
          npm install

      - name: CI done
        run: echo "CI pipeline finished"
